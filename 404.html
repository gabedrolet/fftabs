<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>fftabs: page moved</title>
  <script>
    (function () {
      var rel = location.pathname.replace(/^\/+/, '');
      function go(to) { location.replace(to || '/'); }
      fetch('/redirects.json')
        .then(function (r) { return r.json(); })
        .then(function (map) {
          var to = map[rel + location.search] || map[rel];
          if (to) go(to);
          else document.getElementById('msg').textContent = 'This page isn’t in the archive.';
        })
        .catch(function () { go('/'); });
    })();
  </script>
</head>
<body style="background:#141414;color:#ddd;font-family:system-ui,sans-serif;padding:2rem">
  <p id="msg">Page moved, redirecting…</p>
  <p><a href="/" style="color:#ff6a5c">Go to the fftabs home page</a></p>
</body>
</html>
