<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fftabs: redirecting</title>
  <script>
    // Forwards old fftabs.com URLs (tabs_guitar_1997.php, lyrics_1997.php?track=11, …)
    // to the new hash routes, using redirects.json (generated by tools/build_index.py).
    (function () {
      var path = location.pathname;
      var base = path.indexOf('/fftabs/') === 0 ? '/fftabs/' : '/';
      var rel = path.slice(base.length);
      var key = rel + location.search;
      function go(route) { location.replace(base + (route || '#/')); }
      fetch(base + 'redirects.json')
        .then(function (r) { return r.json(); })
        .then(function (map) { go(map[key] || map[rel]); })
        .catch(function () { go('#/'); });
    })();
  </script>
</head>
<body style="background:#141414;color:#ddd;font-family:system-ui,sans-serif;padding:2rem">
  <p>Page moved. Redirecting to <a href="/" style="color:#ff6a5c">fftabs</a>…</p>
</body>
</html>
